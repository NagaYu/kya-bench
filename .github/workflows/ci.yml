name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Only this step downloads anything (cryptography, pytest from PyPI).
      # Everything after it runs offline: no test, generator or suite step uses the network.
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Tests, deterministic regeneration, run-suite
        run: bash tools/ci.sh
